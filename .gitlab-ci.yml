stages:
  - build
  - publish

build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist

publish:
  stage: publish
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npm config set @nextjs-shared:registry "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken="${CI_JOB_TOKEN}"
    - 'node -e "const v=require(\"./packages/utils/package.json\").version; const t=(process.env.CI_COMMIT_TAG||\"\").replace(/^v/,\"\"); if(t && v!==t){ console.error(\"Version mismatch: package.json=\"+v+\" tag=\"+t); process.exit(1)}"'
    - npm publish -w @nextjs-shared/utils
