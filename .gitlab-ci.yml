stages:
  - build
  - publish

build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run -w @nextjs-shared/utils build
  artifacts:
    paths:
      - packages/**/dist

publish:
  stage: publish
  image: node:20
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npm config set @nextjs-shared:registry "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
    - npm config set always-auth true
    - npm publish -w @nextjs-shared/utils
